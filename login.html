<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Title -->
    <title>Echorise Indie Label</title>

    <!-- Favicon -->
    <link rel="icon" href="img/core-img/favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- Preloader -->
    <div class="preloader d-flex align-items-center justify-content-center">
        <div class="lds-ellipsis">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    

    

    <!-- ##### Login Area Start ##### -->
    <section class="login-area section-padding-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="login-content">
                        <div class="musicdash-logo">
       <a href="index.html"> <img src="img/core-img/logo.png" alt="Logo"></a>
    </div>
                        <h2>Login</h2>
                        <h3>Welcome Back</h3>
                        <!-- Login Form -->
                        <div class="login-form">
                            <form action="dashboard.html" method="post">
                                <div class="form-group">
                                    <label for="exampleInputEmail1">Email address</label>
                                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter E-mail">
                                    <small id="emailHelp" class="form-text text-muted"><i class="fa fa-lock mr-2"></i>We'll never share your email with anyone else.</small>
                                </div>
                               <div class="input-group password-group">
    <input type="password" id="password" placeholder="Password" required>
    <span id="togglePassword" class="eye-icon">👁️</span>
  </div>
                                <button type="submit" class="btn oneMusic-btn mt-30">Login</button>
                                <div class="mt-4 text-center">
                                <p>New User? 
                                    <a href="register.html">Create an Account</a>
                                </p>
                            </div>
                            </form>
                            <div class="social-login">
    <p>Or sign up using</p>

    <div class="social-icons">
        <a href="#" class="social-btn facebook">
            <i class="fa-brands fa-facebook"></i>
        </a>

        <a href="#" class="social-btn google">
            <i class="fa-brands fa-google"></i>
        </a>

        <a href="#" class="social-btn twitter">
            <i class="fa-brands fa-twitter"></i>
        </a>
         <a href="#" class="social-btn apple">
        <i class="fa-brands fa-apple"></i>
    </a>
    </div>
</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ##### Login Area End ##### -->

    

    <!-- ##### All Javascript Script ##### -->
    <!-- jQuery-2.2.4 js -->
    <script src="js/jquery/jquery-2.2.4.min.js"></script>
    <!-- Popper js -->
    <script src="js/bootstrap/popper.min.js"></script>
    <!-- Bootstrap js -->
    <script src="js/bootstrap/bootstrap.min.js"></script>
    <!-- All Plugins js -->
    <script src="js/plugins/plugins.js"></script>
    <!-- Active js -->
    <script src="js/active.js"></script>
    <script>
  const togglePassword = document.getElementById("togglePassword");
  const password = document.getElementById("password");

  togglePassword.addEventListener("click", () => {
    const type = password.type === "password" ? "text" : "password";
    password.type = type;

    // icon change
    togglePassword.textContent = type === "password" ? "👁️" : "🙈";
  });
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Favicon -->
    <link rel="icon" href="img/core-img/favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="musicdash-wrapper">

<!-- SIDEBAR -->
<div class="musicdash-sidebar" id="sidebar">
    <div class="musicdash-logo">
       <a href="index.html"> <img src="img/core-img/logo.png" alt="Logo"></a>
    </div>

    <ul class="musicdash-menu">

    <li>
        <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
    </li>

    <li>
        <a href="artists.html">
            <i class="bi bi-person"></i>
            <span>Artists</span>
        </a>
    </li>

    <li>
        <a href="releases.html">
            <i class="bi bi-music-note-beamed"></i>
            <span>Releases</span>
        </a>
    </li>

    <li>
        <a href="tours.html">
            <i class="bi bi-calendar-event"></i>
            <span>Tours</span>
        </a>
    </li>

    <li>
        <a href="merchandise.html">
            <i class="bi bi-bag"></i>
            <span>Merchandise</span>
        </a>
    </li>

    <li>
        <a href="analytics.html">
            <i class="bi bi-bar-chart"></i>
            <span>Analytics</span>
        </a>
    </li>

    <li>
        <a class="active" href="logout.html">
            <i class="bi bi-gear"></i>
            <span>Log Out</span>
        </a>
    </li>

</ul>

</div>

<!-- MAIN CONTENT -->
<div class="musicdash-main">

    <div class="logout-wrapper">
        <div class="logout-box">
            <i class="bi bi-box-arrow-right"></i>
            <h2>Logged Out</h2>
            <p>Your session has ended securely.  
            Thank you for managing your label with us!</p>

            <div class="logout-actions">
                <a href="login.html" class="logout-btn">Logout</a>
                <a href="dashboard.html" class="home-btn">No</a>
            </div>
        </div>
    </div>

</div>


</div>

<!-- JS -->
<script>
document.getElementById("toggleBtn").addEventListener("click", function(){
    document.getElementById("sidebar").classList.toggle("active");
});
</script>

</body>
</html>

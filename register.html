<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>One Music - Register</title>

    <!-- Favicon -->
    <link rel="icon" href="img/core-img/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Preloader -->
    <div class="preloader d-flex align-items-center justify-content-center">
        <div class="lds-ellipsis">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- ##### Register Area Start ##### -->
    <section class="login-area section-padding-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="login-content">
                        <div class="musicdash-logo">
       <a href="index.html"> <img src="img/core-img/logo.png" alt="Logo"></a>
    </div>
                        <h2>Register</h2>
                        <h3>Join One Music</h3>

                        <!-- Register Form -->
                        <div class="login-form">
                            <form action="login.html" method="post">

                                <div class="form-group">
                                    <label for="fullName">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" placeholder="Enter Full Name">
                                </div>

                                <div class="form-group">
                                    <label for="registerEmail">Email address</label>
                                    <input type="email" class="form-control" id="registerEmail" placeholder="Enter E-mail">
                                </div>

                                <div class="form-group password-group">
                                    <label for="registerPassword">Password</label>
                                    <input type="password" class="form-control" id="registerPassword" placeholder="Create Password">
                                    <span id="toggleRegisterPassword" class="eye-icon">👁️</span>
                                </div>

                                <div class="form-group password-group">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
                                    <span id="toggleConfirmPassword" class="eye-icon">👁️</span>
                                </div>

                                <button type="submit" class="btn oneMusic-btn mt-30">
                                    Create Account
                                </button>

                                <div class="mt-4 text-center">
                                    <p>Already have an account?
                                        <a href="login.html">Login Here</a>
                                    </p>
                                </div>

                            </form>

                            <div class="social-login">
                                <p>Or sign up using</p>
                                <div class="social-icons">
                                    <a href="#" class="social-btn google">
                                        <i class="fa-brands fa-google"></i>
                                    </a>
                                    <a href="#" class="social-btn apple">
                                        <i class="fa-brands fa-apple"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <!-- End Register Form -->

                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ##### Register Area End ##### -->

    <!-- ##### All Javascript Script ##### -->
    <script src="js/jquery/jquery-2.2.4.min.js"></script>
    <script src="js/bootstrap/popper.min.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
    <script src="js/plugins/plugins.js"></script>
    <script src="js/active.js"></script>
    <script>
        const toggleRegPwd = document.getElementById("toggleRegisterPassword");
        const regPwd = document.getElementById("registerPassword");
        toggleRegPwd.addEventListener("click", () => {
            const type = regPwd.type === "password" ? "text" : "password";
            regPwd.type = type;
            toggleRegPwd.textContent = type === "password" ? "👁️" : "🙈";
        });

        const toggleConfPwd = document.getElementById("toggleConfirmPassword");
        const confPwd = document.getElementById("confirmPassword");
        toggleConfPwd.addEventListener("click", () => {
            const type = confPwd.type === "password" ? "text" : "password";
            confPwd.type = type;
            toggleConfPwd.textContent = type === "password" ? "👁️" : "🙈";
        });
    </script>

</body>
</html>
